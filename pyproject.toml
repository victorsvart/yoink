[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "yoink-cli"
version = "0.1.2"
description = "Download videos from individual Twitter/X posts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "platformdirs>=4.3,<5",
  "playwright>=1.51,<2",
  "yt-dlp>=2025.3.31",
]

[project.scripts]
yoink = "yoink.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pyright>=1.1.400,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yoink"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]
warn_unreachable = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
